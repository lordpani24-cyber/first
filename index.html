<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semesta Kita - Permintaan Maaf</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0c14;
            --bg-card: rgba(20, 24, 38, 0.75);
            --accent-pink: #ff6b95;
            --accent-purple: #9b51e0;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(255, 107, 149, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Starry Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255,107,149,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.4;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Header & Audio Control */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .audio-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: var(--accent-pink);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .audio-btn:hover {
            background: rgba(255, 107, 149, 0.15);
        }

        /* Main Card */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .apology-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #ffe4e6;
        }

        .timer-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 16px;
        }

        .time-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 4px;
            border-radius: 12px;
        }

        .time-val {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-pink);
        }

        .time-lbl {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Interactive Buttons */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 28px;
            position: relative;
            min-height: 50px;
        }

        .btn-forgive {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 149, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-forgive:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 149, 0.6);
        }

        .btn-reject {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            position: absolute;
            transition: all 0.2s ease-out;
        }

        /* Modal Alert */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 999;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--accent-pink);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 107, 149, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            max-width: 320px;
            width: 85%;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.5rem;
            color: var(--accent-pink);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .modal-timer {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Audio Element: Stephanie Poetri - I Love You 3000 -->
    <audio id="bgMusic" loop autoplay>
        <source src="https://raw.githubusercontent.com/anandadwi/music-host/main/iloveyou3000.mp3" type="audio/mpeg">
        Browser kamu tidak mendukung pemutar audio.
    </audio>

    <div class="stars"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <span style="font-size: 14px; font-weight: 600; color: var(--accent-pink);">✨ Semesta Kita</span>
            <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">
                🎵 <span id="audioStatus">Musik On</span>
            </button>
        </div>

        <!-- Main Card -->
        <div class="glass-card">
            <p class="apology-text">"halo sayang aku harap kamu menerima permintaan maafku ini"</p>
            
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Waktu kebersamaan kita sejak 1 November 2026:</div>
            <div class="timer-box">
                <div class="time-item">
                    <div class="time-val" id="days">0</div>
                    <div class="time-lbl">Hari</div>
                </div>
                <div class="time-item">
                    <div class="time-val" id="hours">0</div>
                    <div class="time-lbl">Jam</div>
                </div>
                <div class="time-item">
                    <div class="time-val" id="minutes">0</div>
                    <div class="time-lbl">Menit</div>
                </div>
                <div class="time-item">
                    <div class="time-val" id="seconds">0</div>
                    <div class="time-lbl">Detik</div>
                </div>
            </div>

            <!-- Tombol Interaktif -->
            <div class="btn-group" id="btnGroup">
                <button class="btn-forgive" onclick="showLoveAlert()">Maafkan Aku ❤️</button>
                <button class="btn-reject" id="btnReject" onmouseover="moveRejectButton()" onclick="moveRejectButton()">Enggak 😜</button>
            </div>
        </div>
    </div>

    <!-- Alert Modal 5 Detik -->
    <div class="modal-overlay" id="loveModal">
        <div class="modal-content">
            <div class="modal-title">💖 i love you for ever 💖</div>
            <p style="font-size: 13px; color: #ffe4e6; margin-top: 8px;">Terima kasih sudah memaafkan aku ya sayang!</p>
            <div class="modal-timer">Pesan ini akan tertutup otomatis dalam <span id="countdown">5</span> detik...</div>
        </div>
    </div>

    <script>
        // --- 1. Timer Kebersamaan ---
        const startDate = new Date("2026-11-01T00:00:00").getTime();
        
        function updateTimer() {
            const now = new Date().getTime();
            const diff = now - startDate;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours;
                document.getElementById('minutes').innerText = minutes;
                document.getElementById('seconds').innerText = seconds;
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // --- 2. Tombol "Enggak" Kabur ---
        function moveRejectButton() {
            const btn = document.getElementById('btnReject');
            const container = document.getElementById('btnGroup');
            
            const containerRect = container.getBoundingClientRect();
            const x = Math.random() * (containerRect.width - 100) - (containerRect.width / 2 - 50);
            const y = Math.random() * 120 - 60;

            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // --- 3. Alert 5 Detik ---
        function showLoveAlert() {
            const modal = document.getElementById('loveModal');
            const countdownEl = document.getElementById('countdown');
            let timeLeft = 5;

            modal.classList.add('active');
            countdownEl.innerText = timeLeft;

            const interval = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    modal.classList.remove('active');
                }
            }, 1000);
        }

        // --- 4. Audio Control & Autoplay Handler ---
        const audio = document.getElementById('bgMusic');
        const audioStatus = document.getElementById('audioStatus');

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                audioStatus.innerText = "Musik On";
            } else {
                audio.pause();
                audioStatus.innerText = "Musik Off";
            }
        }

        // Jalankan audio otomatis saat ada interaksi pertama di halaman jika diblokir browser
        window.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(() => {});
            }
        }, { once: true });
    </script>
</body>
</html>
